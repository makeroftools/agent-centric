# Gates — the deterministic floor for every change.
#
# Law 12 note: CI is the operator's automation and, at L2+, the isolated
# validator. The AUTHORING agent never runs this suite; CI does. No network
# services are required: the deterministic stub is the default.
name: gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync (dev)
        run: uv sync --extra dev

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Types (mypy)
        run: uv run mypy src

      - name: Readiness gate (cbp-check)
        run: uv run agent-centric cbp-check

      - name: Invariant suite (operator's isolated validator)
        run: uv run pytest -p no:cacheprovider

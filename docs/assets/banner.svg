<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Agent-centric — a deterministic platform for governed, verifiable agents">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="0.55" stop-color="#0e1430"/>
      <stop offset="1" stop-color="#151d3f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <circle cx="320" cy="180" r="250" fill="url(#glow)"/>

  <!-- rooted tree of governed agents -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" opacity="0.9">
    <line x1="320" y1="84" x2="208" y2="176"/>
    <line x1="320" y1="84" x2="432" y2="176"/>
    <line x1="208" y1="176" x2="128" y2="272"/>
    <line x1="208" y1="176" x2="288" y2="272"/>
    <line x1="432" y1="176" x2="352" y2="272"/>
    <line x1="432" y1="176" x2="512" y2="272"/>
  </g>
  <circle cx="320" cy="84" r="22" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.55"/>
  <circle cx="320" cy="84" r="11" fill="#e2e8f0"/>
  <circle cx="208" cy="176" r="8" fill="#e2e8f0"/>
  <circle cx="432" cy="176" r="8" fill="#e2e8f0"/>
  <g fill="#94a3b8">
    <circle cx="128" cy="272" r="6"/>
    <circle cx="288" cy="272" r="6"/>
    <circle cx="352" cy="272" r="6"/>
    <circle cx="512" cy="272" r="6"/>
  </g>
  <g fill="none" stroke="#34d399" stroke-width="2" opacity="0.85">
    <circle cx="128" cy="272" r="10"/>
    <circle cx="288" cy="272" r="10"/>
    <circle cx="352" cy="272" r="10"/>
    <circle cx="512" cy="272" r="10"/>
  </g>

  <!-- wordmark -->
  <text x="606" y="150" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="66" font-weight="700" fill="#f1f5f9" letter-spacing="0.5">Agent-centric</text>
  <text x="608" y="198" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="#9fb0cd">A deterministic platform for governed, verifiable agents.</text>
  <text x="610" y="246" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#7c8db0" letter-spacing="3.2">DETERMINISTIC · LOCAL-FIRST · FAIL-CLOSED · AUDITABLE</text>
</svg>
